{% extends "base.html" %}

{% block title %}E-mail enviado | 3DimensiaPT{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full text-center space-y-4 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h2 class="text-xl font-black text-slate-900">Link enviado</h2>
        <p class="text-xs text-slate-500">
            Se o endereço coincidir com uma conta registrada, você receberá as instruções por e-mail.
        </p>
        <a href="{% url 'login' %}" class="inline-block mt-4 text-xs font-bold text-rose-600 hover:underline">
            ← Voltar ao login
        </a>
    </div>
</div>
{% endblock %}
