{% extends "base.html" %}

{% block title %}Recuperar Contraseña | 3DimensiaPT{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-6">
        <div class="text-center">
            <span class="inline-block p-3 bg-amber-100 text-amber-600 rounded-2xl mb-3 shadow-sm">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </span>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Recuperación de Contraseña</h2>
            <p class="text-xs text-slate-500 mt-1">Introduce tu correo para recibir un enlace seguro de restablecimiento.</p>
        </div>

        <form method="POST" class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                {{ form.email }}
            </div>

            <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-black text-sm rounded-xl shadow-lg shadow-rose-600/30 transition active:scale-95">
                Enviar Enlace de Recuperación
            </button>
        </form>

        <p class="text-center text-xs text-slate-500">
            <a href="{% url 'login' %}" class="font-bold text-slate-600 hover:underline">← Volver al inicio de sesión</a>
        </p>
    </div>
</div>
{% endblock %}
